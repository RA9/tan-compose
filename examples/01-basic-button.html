<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Button Example - Tan Compose</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 {
      color: #333;
      border-bottom: 2px solid #007bff;
      padding-bottom: 10px;
    }
    .demo-section {
      background: white;
      padding: 30px;
      border-radius: 8px;
      margin: 20px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <h1>Basic Button Component Example</h1>

  <div class="demo-section">
    <h2>Simple Button</h2>
    <p>A basic button component with custom styling:</p>
    <tan-btn>Click Me!</tan-btn>
  </div>

  <div class="demo-section">
    <h2>Multiple Instances</h2>
    <p>The same component can be reused multiple times:</p>
    <tan-btn>Button 1</tan-btn>
    <tan-btn>Button 2</tan-btn>
    <tan-btn>Button 3</tan-btn>
  </div>

  <script type="module">
    import { describe, build } from '../mod.ts';

    const formBtn = describe({
      tag: "button",
      action: (event) => {
        console.log("Button clicked!", event);
        alert("Button clicked! Check the console.");
      },
      className: "my-button",
      styles: {
        margin: "10px",
        padding: "12px 24px",
        backgroundColor: "#007bff",
        color: "white",
        border: "none",
        borderRadius: "6px",
        cursor: "pointer",
        fontSize: "16px",
        transition: "background-color 0.3s"
      },
    });

    build("tan-btn", formBtn);
  </script>
</body>
</html>
