<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Themed Components Example - Tan Compose</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
        background: #f5f5f5;
      }
      h1 {
        color: #333;
        border-bottom: 2px solid #007bff;
        padding-bottom: 10px;
      }
      .demo-section {
        background: white;
        padding: 30px;
        border-radius: 8px;
        margin: 20px 0;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <h1>Themed Components Example</h1>

    <div class="demo-section">
      <h2>Using CSS Variables for Theming</h2>
      <p>These buttons use CSS variables defined in their theme:</p>
      <primary-btn>Primary Button</primary-btn>
      <success-btn>Success Button</success-btn>
      <danger-btn>Danger Button</danger-btn>
      <warning-btn>Warning Button</warning-btn>
    </div>

    <div class="demo-section">
      <h2>Themed Card Component</h2>
      <themed-card></themed-card>
    </div>

    <script type="module">
      import { build, describe } from "../mod.ts";

      // Primary themed button
      const primaryBtn = describe({
        tag: "button",
        theme: {
          btnColor: "#007bff",
          btnHover: "#0056b3",
          textColor: "#ffffff",
        },
        template: "",
        styles: {
          backgroundColor: "var(--btnColor)",
          color: "var(--textColor)",
          padding: "12px 24px",
          margin: "5px",
          border: "none",
          borderRadius: "6px",
          cursor: "pointer",
          fontSize: "16px",
          transition: "all 0.3s",
        },
        action: (event) => {
          console.log("Primary button clicked");
        },
      });

      // Success themed button
      const successBtn = describe({
        tag: "button",
        theme: {
          btnColor: "#28a745",
          btnHover: "#218838",
          textColor: "#ffffff",
        },
        styles: {
          backgroundColor: "var(--btnColor)",
          color: "var(--textColor)",
          padding: "12px 24px",
          margin: "5px",
          border: "none",
          borderRadius: "6px",
          cursor: "pointer",
          fontSize: "16px",
          transition: "all 0.3s",
        },
      });

      // Danger themed button
      const dangerBtn = describe({
        tag: "button",
        theme: {
          btnColor: "#dc3545",
          btnHover: "#c82333",
          textColor: "#ffffff",
        },
        styles: {
          backgroundColor: "var(--btnColor)",
          color: "var(--textColor)",
          padding: "12px 24px",
          margin: "5px",
          border: "none",
          borderRadius: "6px",
          cursor: "pointer",
          fontSize: "16px",
          transition: "all 0.3s",
        },
      });

      // Warning themed button
      const warningBtn = describe({
        tag: "button",
        theme: {
          btnColor: "#ffc107",
          btnHover: "#e0a800",
          textColor: "#212529",
        },
        styles: {
          backgroundColor: "var(--btnColor)",
          color: "var(--textColor)",
          padding: "12px 24px",
          margin: "5px",
          border: "none",
          borderRadius: "6px",
          cursor: "pointer",
          fontSize: "16px",
          transition: "all 0.3s",
        },
      });

      // Themed card component
      const themedCard = describe({
        tag: "div",
        theme: {
          cardBg: "#ffffff",
          cardBorder: "#e0e0e0",
          primaryColor: "#007bff",
          textColor: "#333",
          spacing: "20px",
        },
        styles: {
          backgroundColor: "var(--cardBg)",
          border: "2px solid var(--cardBorder)",
          borderRadius: "12px",
          padding: "var(--spacing)",
          boxShadow: "0 4px 8px rgba(0,0,0,0.1)",
          maxWidth: "400px",
        },
        children: [
          describe({
            tag: "h3",
            template: "Themed Card Component",
            styles: {
              color: "var(--primaryColor)",
              marginTop: "0",
              marginBottom: "15px",
            },
          }),
          describe({
            tag: "p",
            template:
              "This card uses CSS variables for consistent theming. All colors and spacing are defined in the theme object.",
            styles: {
              color: "var(--textColor)",
              lineHeight: "1.6",
              marginBottom: "15px",
            },
          }),
          describe({
            tag: "button",
            template: "Learn More",
            styles: {
              backgroundColor: "var(--primaryColor)",
              color: "#fff",
              border: "none",
              padding: "10px 20px",
              borderRadius: "6px",
              cursor: "pointer",
              fontSize: "14px",
            },
            action: () => {
              alert(
                "Themed components make styling consistent and easy to maintain!",
              );
            },
          }),
        ],
      });

      build("primary-btn", primaryBtn);
      build("success-btn", successBtn);
      build("danger-btn", dangerBtn);
      build("warning-btn", warningBtn);
      build("themed-card", themedCard);
    </script>
  </body>
</html>
