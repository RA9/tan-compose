name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate version matches latest tag
        run: |
          # Read current version from deno.json
          CURRENT_VERSION=$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('deno.json')).version)")
          echo "Current version in deno.json: $CURRENT_VERSION"

          # Get the latest version tag (vX.Y.Z format, sorted by version)
          LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)
          echo "Latest git tag: $LATEST_TAG"

          if [ -z "$LATEST_TAG" ]; then
            echo "No version tags found — skipping validation."
            exit 0
          fi

          # Strip the 'v' prefix from the tag
          LATEST_TAG_VERSION="${LATEST_TAG#v}"

          if [ "$CURRENT_VERSION" != "$LATEST_TAG_VERSION" ]; then
            echo "::error::Version mismatch! deno.json has v$CURRENT_VERSION but the latest git tag is $LATEST_TAG."
            echo "This usually means the version was bumped manually without creating a tag."
            echo "Either create the missing tag (git tag v$CURRENT_VERSION && git push origin v$CURRENT_VERSION) or reset deno.json to $LATEST_TAG_VERSION before running this workflow."
            exit 1
          fi

          echo "Version is in sync with git tags."

      - name: Bump version
        id: bump
        run: |
          # Read current version from deno.json
          CURRENT_VERSION=$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('deno.json')).version)")
          echo "Current version: $CURRENT_VERSION"

          # Split version into parts
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Bump based on input
          case "${{ github.event.inputs.version_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Update deno.json
          deno eval "
            const config = JSON.parse(Deno.readTextFileSync('deno.json'));
            config.version = '$NEW_VERSION';
            Deno.writeTextFileSync('deno.json', JSON.stringify(config, null, 2) + '\n');
          "

      - name: Commit and tag
        run: |
          git add deno.json
          git commit -m "chore: bump version to v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin main
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          release_name: Release v${{ steps.bump.outputs.version }}
          body: |
            Version ${{ steps.bump.outputs.version }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          draft: false
          prerelease: false

      - name: Verify types
        run: deno check build.ts

      - name: Run tests
        run: deno test --allow-all

      - name: Publish to JSR
        run: npx jsr publish
