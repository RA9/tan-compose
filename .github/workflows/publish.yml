name: Publish to JSR

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14

      - name: Verify types
        run: deno check build.ts

      - name: Run tests
        run: deno test --allow-all

      - name: Publish to JSR
        run: npx jsr publish
