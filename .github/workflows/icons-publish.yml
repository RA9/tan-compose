name: Publish icons to JSR

on:
  push:
    tags:
      - "icons-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify types (icons)
        working-directory: icons
        run: deno task check

      - name: Run tests (workspace)
        run: deno test --allow-read --allow-env --allow-net --allow-write

      - name: Publish icons to JSR
        working-directory: icons
        # Use `deno publish` directly instead of `npx jsr publish` —
        # the jsr wrapper doesn't forward --allow-dirty to its
        # bundled deno binary, and the workspace test step above
        # re-resolves the jsr:@ra9/tan-compose import which rewrites
        # deno.lock. The lockfile churn is benign (not part of the
        # publish bundle), so --allow-dirty is the right call.
        run: deno publish --allow-dirty
