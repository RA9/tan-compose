<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tan Compose Playground — write describe() and build() calls and see the result instantly."
    />
    <title>Playground — Tan Compose</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #faf8f3;
        --surface: #ffffff;
        --ink: #14171f;
        --ink-soft: #4a5061;
        --ink-muted: #6b7280;
        --rule: #ece5d3;
        --rule-strong: #d9cfb8;
        --accent: #a16939;
        --accent-hover: #8a572d;
        --accent-soft: #efe2cf;
        --code-bg: #14171f;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        color: var(--ink);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Top bar */
      .topbar {
        flex: 0 0 auto;
        border-bottom: 1px solid var(--rule);
        background: var(--bg);
      }

      .topbar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 56px;
        padding: 0 20px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--ink);
        text-decoration: none;
      }

      .brand-mark {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: var(--accent);
      }

      .version-pill {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 0.72rem;
        font-weight: 500;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-hover);
        border: 1px solid var(--rule-strong);
      }

      .topbar nav {
        display: flex;
        gap: 18px;
        align-items: center;
      }

      .topbar nav a {
        color: var(--ink-soft);
        text-decoration: none;
        font-size: 0.92rem;
        font-weight: 500;
      }

      .topbar nav a:hover,
      .topbar nav a.active {
        color: var(--accent);
      }

      /* Toolbar */
      .toolbar {
        flex: 0 0 auto;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        border-bottom: 1px solid var(--rule);
        background: var(--surface);
        gap: 12px;
        font-size: 0.85rem;
      }

      .toolbar-left,
      .toolbar-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .toolbar-label {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        color: var(--ink-muted);
        font-size: 0.78rem;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 0.78rem;
        color: var(--ink-muted);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--rule-strong);
        transition: background 0.2s ease;
      }

      .status.live .status-dot {
        background: #4ca777;
      }

      .status.error .status-dot {
        background: #d4574a;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: "Inter", sans-serif;
        font-size: 0.82rem;
        font-weight: 500;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        border: 1px solid transparent;
        background: transparent;
        color: var(--ink-soft);
        transition: all 0.15s ease;
      }

      .btn:hover {
        background: var(--bg);
        color: var(--ink);
      }

      .btn.primary {
        background: var(--ink);
        color: #fff;
      }

      .btn.primary:hover {
        background: var(--accent);
      }

      .btn.outline {
        border-color: var(--rule-strong);
      }

      .btn.outline:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* Main split */
      .split {
        flex: 1 1 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 0;
      }

      .pane {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }

      .pane.editor {
        border-right: 1px solid var(--rule);
      }

      /* Tab strip */
      .tabs {
        flex: 0 0 auto;
        display: flex;
        border-bottom: 1px solid var(--rule);
        background: var(--surface);
        height: 38px;
      }

      .tab {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 18px;
        height: 100%;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--ink-muted);
        background: transparent;
        border: none;
        border-right: 1px solid var(--rule);
        cursor: pointer;
        transition: color 0.15s ease;
      }

      .tab:hover {
        color: var(--ink-soft);
      }

      .tab.active {
        color: var(--ink);
        background: var(--bg);
        box-shadow: inset 0 -2px 0 var(--accent);
      }

      .tab .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        opacity: 0;
        transition: opacity 0.15s ease;
      }

      .tab.dirty .dot {
        opacity: 1;
      }

      /* Editor host */
      .editors {
        flex: 1 1 auto;
        position: relative;
        min-height: 0;
        background: #1f2330;
      }

      .editor-host {
        position: absolute;
        inset: 0;
        display: none;
      }

      .editor-host.active {
        display: block;
      }

      .editor-host .cm-editor {
        height: 100%;
      }

      .editor-host .cm-scroller {
        font-family: "JetBrains Mono", ui-monospace, monospace !important;
        font-size: 13.5px;
      }

      /* Preview pane */
      .pane.preview {
        background: var(--surface);
      }

      .preview-frame-wrap {
        flex: 1 1 auto;
        min-height: 0;
        background: #ffffff;
        position: relative;
      }

      .preview-frame-wrap iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        background: #fff;
      }

      .console {
        flex: 0 0 auto;
        max-height: 30%;
        min-height: 38px;
        border-top: 1px solid var(--rule);
        background: var(--code-bg);
        display: flex;
        flex-direction: column;
      }

      .console-head {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 14px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 0.76rem;
        color: rgba(239, 230, 212, 0.7);
        border-bottom: 1px solid rgba(239, 230, 212, 0.08);
      }

      .console-head .label {
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .console-head .clear {
        background: transparent;
        border: none;
        color: rgba(239, 230, 212, 0.6);
        font-family: inherit;
        font-size: 0.76rem;
        cursor: pointer;
      }

      .console-head .clear:hover {
        color: rgba(239, 230, 212, 1);
      }

      .console-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 8px 14px 12px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 0.78rem;
        color: rgba(239, 230, 212, 0.8);
        line-height: 1.6;
      }

      .console-row {
        white-space: pre-wrap;
        word-break: break-word;
        padding: 2px 0;
        border-bottom: 1px solid rgba(239, 230, 212, 0.04);
      }

      .console-row:last-child {
        border-bottom: none;
      }

      .console-row.error {
        color: #f08a7e;
      }

      .console-row.warn {
        color: #f0c878;
      }

      .console-row.info {
        color: rgba(239, 230, 212, 0.7);
      }

      .console-row .level {
        opacity: 0.5;
        margin-right: 10px;
      }

      .console-empty {
        color: rgba(239, 230, 212, 0.35);
        font-style: italic;
      }

      /* Mobile: stack */
      @media (max-width: 860px) {
        body {
          overflow: auto;
          height: auto;
        }

        .split {
          grid-template-columns: 1fr;
          min-height: 0;
        }

        .pane {
          height: 60vh;
        }

        .pane.editor {
          border-right: none;
          border-bottom: 1px solid var(--rule);
        }

        .console {
          max-height: 40%;
        }

        .topbar nav .nav-hide-sm {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="./index.html">
          <span class="brand-mark" aria-hidden="true"></span>
          tan-compose
          <span class="version-pill">v0.2.0</span>
        </a>
        <nav>
          <a href="./docs.html" class="nav-hide-sm">Docs</a>
          <a href="./examples.html" class="nav-hide-sm">Examples</a>
          <a href="./playground.html" class="active">Playground</a>
          <a
            href="https://github.com/ra9/tan-compose"
            target="_blank"
            rel="noopener"
            >GitHub</a
          >
        </nav>
      </div>
    </header>

    <div class="toolbar">
      <div class="toolbar-left">
        <span class="toolbar-label">playground</span>
        <span class="status" id="status">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text">idle</span>
        </span>
      </div>
      <div class="toolbar-right">
        <button class="btn outline" id="btn-reset" type="button">Reset</button>
        <button class="btn primary" id="btn-run" type="button">
          Run <span style="opacity: 0.7; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;">⏎</span>
        </button>
      </div>
    </div>

    <div class="split">
      <section class="pane editor">
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="js" role="tab" aria-selected="true">
            <span class="dot" aria-hidden="true"></span>
            script.js
          </button>
          <button class="tab" data-tab="html" role="tab" aria-selected="false">
            <span class="dot" aria-hidden="true"></span>
            markup.html
          </button>
        </div>
        <div class="editors">
          <div class="editor-host active" id="editor-js"></div>
          <div class="editor-host" id="editor-html"></div>
        </div>
      </section>

      <section class="pane preview">
        <div class="tabs">
          <button class="tab active" type="button" disabled style="cursor: default;">
            preview
          </button>
          <span style="flex: 1 1 auto; border-right: 1px solid var(--rule);"></span>
        </div>
        <div class="preview-frame-wrap">
          <iframe
            id="preview"
            title="Preview"
            sandbox="allow-scripts allow-same-origin allow-modals"
            referrerpolicy="no-referrer"
          ></iframe>
        </div>
        <div class="console">
          <div class="console-head">
            <span class="label">Console</span>
            <button class="clear" id="console-clear" type="button">clear</button>
          </div>
          <div class="console-body" id="console-body">
            <div class="console-empty">No output yet.</div>
          </div>
        </div>
      </section>
    </div>

    <script type="module">
      import { EditorView, basicSetup } from "https://esm.sh/codemirror@6.0.1";
      import { javascript } from "https://esm.sh/@codemirror/lang-javascript@6.2.2";
      import { html as htmlLang } from "https://esm.sh/@codemirror/lang-html@6.4.9";
      import { oneDark } from "https://esm.sh/@codemirror/theme-one-dark@6.1.2";
      import { keymap } from "https://esm.sh/@codemirror/view@6.26.3";

      const DEFAULT_JS = `import { describe, build } from "tan-compose";

build("hello-card", describe({
  theme: {
    surface: "#ffffff",
    border: "#ece5d3",
    ink: "#14171f",
    soft: "#5a6072",
    accent: "#a16939",
  },
  styles: {
    display: "block",
    background: "var(--surface)",
    border: "1px solid var(--border)",
    borderRadius: "12px",
    padding: "22px",
    maxWidth: "360px",
    fontFamily: "system-ui, -apple-system, sans-serif",
  },
  children: [
    describe({
      tag: "h3",
      template: "Hello, Tan Compose!",
      styles: {
        color: "var(--ink)",
        margin: "0 0 8px",
        fontSize: "1.15rem",
      },
    }),
    describe({
      tag: "p",
      template: "Edit the JS or HTML on the left and watch this preview update.",
      styles: {
        color: "var(--soft)",
        margin: "0 0 16px",
        lineHeight: "1.55",
        fontSize: "0.94rem",
      },
    }),
    describe({
      tag: "button",
      template: "Click me",
      styles: {
        padding: "8px 14px",
        background: "var(--accent)",
        color: "#fff",
        border: "none",
        borderRadius: "6px",
        cursor: "pointer",
        fontWeight: 500,
      },
      action: () => {
        console.log("Clicked!");
        alert("Hello from a tan-compose component");
      },
    }),
  ],
}));
`;

      const DEFAULT_HTML = `<hello-card></hello-card>
`;

      const STORAGE_KEY = "tan-compose-playground:v1";

      // ---------- Persistence ----------
      const saved = (() => {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        } catch {
          return null;
        }
      })();

      const initialJs = saved?.js ?? DEFAULT_JS;
      const initialHtml = saved?.html ?? DEFAULT_HTML;

      // ---------- Editors ----------
      const runShortcut = keymap.of([
        {
          key: "Mod-Enter",
          run: () => {
            scheduleRun(0);
            return true;
          },
        },
      ]);

      const onChange = EditorView.updateListener.of((u) => {
        if (u.docChanged) {
          markDirty();
          scheduleRun();
        }
      });

      const jsView = new EditorView({
        doc: initialJs,
        extensions: [basicSetup, javascript(), oneDark, runShortcut, onChange],
        parent: document.getElementById("editor-js"),
      });

      const htmlView = new EditorView({
        doc: initialHtml,
        extensions: [basicSetup, htmlLang(), oneDark, runShortcut, onChange],
        parent: document.getElementById("editor-html"),
      });

      // ---------- Tab switching ----------
      const tabs = document.querySelectorAll(".tab[data-tab]");
      const hosts = {
        js: document.getElementById("editor-js"),
        html: document.getElementById("editor-html"),
      };
      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          tabs.forEach((t) => {
            t.classList.toggle("active", t === tab);
            t.setAttribute("aria-selected", String(t === tab));
          });
          const which = tab.dataset.tab;
          for (const [k, el] of Object.entries(hosts)) {
            el.classList.toggle("active", k === which);
          }
          (which === "js" ? jsView : htmlView).focus();
        });
      });

      // ---------- Status ----------
      const statusEl = document.getElementById("status");
      const statusText = document.getElementById("status-text");
      function setStatus(state, text) {
        statusEl.classList.remove("live", "error");
        if (state === "live") statusEl.classList.add("live");
        if (state === "error") statusEl.classList.add("error");
        statusText.textContent = text;
      }

      // ---------- Console ----------
      const consoleBody = document.getElementById("console-body");
      function clearConsole() {
        consoleBody.innerHTML =
          '<div class="console-empty">No output yet.</div>';
      }
      function appendConsole(level, args) {
        if (consoleBody.querySelector(".console-empty")) {
          consoleBody.innerHTML = "";
        }
        const row = document.createElement("div");
        row.className = `console-row ${level}`;
        const stamp = document.createElement("span");
        stamp.className = "level";
        stamp.textContent = level;
        const body = document.createElement("span");
        body.textContent = args
          .map((a) => {
            if (a == null) return String(a);
            if (typeof a === "string") return a;
            try {
              return JSON.stringify(a, null, 2);
            } catch {
              return String(a);
            }
          })
          .join(" ");
        row.appendChild(stamp);
        row.appendChild(body);
        consoleBody.appendChild(row);
        consoleBody.scrollTop = consoleBody.scrollHeight;
      }
      document
        .getElementById("console-clear")
        .addEventListener("click", clearConsole);

      // Listen for messages from the iframe.
      window.addEventListener("message", (e) => {
        const data = e.data;
        if (!data || typeof data !== "object") return;
        if (data.__tcPlayground !== true) return;
        if (data.type === "console") {
          appendConsole(data.level, data.args);
        } else if (data.type === "error") {
          appendConsole("error", [data.message]);
          setStatus("error", "error");
        } else if (data.type === "ready") {
          setStatus("live", "live");
        }
      });

      // ---------- Build iframe document ----------
      // We use <base href> so relative URLs resolve to the parent's directory,
      // and an importmap so user code can `import from "tan-compose"`.
      const baseHref = new URL(".", window.location.href).href;

      function buildSrcdoc(userJs, userHtml) {
        const importmap = {
          imports: {
            "tan-compose": "./dist/mod.js",
            "@ra9/tan-compose": "./dist/mod.js",
          },
        };

        return `<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="${escapeAttr(baseHref)}">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    padding: 24px;
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    color: #14171f;
    background: #ffffff;
    line-height: 1.5;
  }
</style>
<script type="importmap">${JSON.stringify(importmap)}<\/script>
</head>
<body>
${userHtml}
<script>
  // Pipe console + uncaught errors back to the parent.
  (function () {
    var levels = ["log", "info", "warn", "error", "debug"];
    levels.forEach(function (level) {
      var orig = console[level];
      console[level] = function () {
        try {
          parent.postMessage({
            __tcPlayground: true,
            type: "console",
            level: level === "debug" ? "info" : level,
            args: Array.prototype.slice.call(arguments).map(serialize),
          }, "*");
        } catch (e) { /* ignore */ }
        return orig.apply(console, arguments);
      };
    });
    function serialize(v) {
      if (v instanceof Error) return v.stack || v.message;
      if (v && typeof v === "object") {
        try { return JSON.parse(JSON.stringify(v)); } catch { return String(v); }
      }
      return v;
    }
    window.addEventListener("error", function (e) {
      parent.postMessage({
        __tcPlayground: true, type: "error",
        message: (e.error && e.error.stack) || e.message,
      }, "*");
    });
    window.addEventListener("unhandledrejection", function (e) {
      parent.postMessage({
        __tcPlayground: true, type: "error",
        message: "Unhandled promise rejection: " + (e.reason && e.reason.stack || e.reason),
      }, "*");
    });
    parent.postMessage({ __tcPlayground: true, type: "ready" }, "*");
  })();
<\/script>
<script type="module">
${userJs}
<\/script>
</body>
</html>`;
      }

      function escapeAttr(s) {
        return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
      }

      // ---------- Run & debounce ----------
      const iframe = document.getElementById("preview");
      let runTimer = null;

      function run() {
        const userJs = jsView.state.doc.toString();
        const userHtml = htmlView.state.doc.toString();
        try {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({ js: userJs, html: userHtml }),
          );
        } catch {
          /* quota exceeded etc., ignore */
        }
        setStatus("idle", "loading…");
        clearDirty();
        // Force a reload by clearing first — customElements registry can't be
        // cleared, so a fresh document is required for re-registration.
        iframe.srcdoc = buildSrcdoc(userJs, userHtml);
      }

      function scheduleRun(delay = 500) {
        if (runTimer) clearTimeout(runTimer);
        if (delay === 0) {
          run();
          return;
        }
        setStatus("idle", "typing…");
        runTimer = setTimeout(run, delay);
      }

      function markDirty() {
        document.querySelectorAll(".tab[data-tab]").forEach((t) => {
          t.classList.add("dirty");
        });
      }
      function clearDirty() {
        document.querySelectorAll(".tab[data-tab]").forEach((t) => {
          t.classList.remove("dirty");
        });
      }

      document
        .getElementById("btn-run")
        .addEventListener("click", () => scheduleRun(0));

      document.getElementById("btn-reset").addEventListener("click", () => {
        if (
          !confirm("Reset both editors to the default example? Your changes will be lost.")
        )
          return;
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch {
          /* ignore */
        }
        jsView.dispatch({
          changes: { from: 0, to: jsView.state.doc.length, insert: DEFAULT_JS },
        });
        htmlView.dispatch({
          changes: {
            from: 0,
            to: htmlView.state.doc.length,
            insert: DEFAULT_HTML,
          },
        });
        clearConsole();
        scheduleRun(0);
      });

      // First run on load.
      run();
    </script>
  </body>
</html>
