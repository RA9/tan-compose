<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Notes from building tan-compose — a tiny declarative library for Web Components."
    />
    <title>Blog — Tan Compose</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="../dist/site.js"></script>
    <style>
      /* Prose layout only. All chrome is provided by the kit. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: var(--tc-font-sans, "Inter", system-ui, sans-serif);
        line-height: 1.6;
        color: var(--tc-color-ink, #14171f);
        background: var(--tc-color-bg, #faf8f3);
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        max-width: 880px;
        margin: 0 auto;
        padding: 0 24px;
      }

      header.page {
        padding: 64px 0 28px;
      }
      .eyebrow {
        font-family: var(--tc-font-mono, "JetBrains Mono", monospace);
        font-size: 0.78rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--tc-color-accent, #a16939);
        margin-bottom: 12px;
      }
      h1 {
        font-size: clamp(2rem, 4vw, 2.6rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.1;
        margin-bottom: 14px;
      }
      .page-lede {
        color: var(--tc-color-ink-soft, #4a5061);
        font-size: 1.05rem;
        max-width: 620px;
      }

      /* Search bar uses tc-input from the kit. */
      .search-row {
        display: flex;
        gap: 12px;
        align-items: end;
        margin-top: 28px;
        padding: 16px;
        background: var(--tc-color-surface, #ffffff);
        border: 1px solid var(--tc-color-rule, #ece5d3);
        border-radius: var(--tc-radius-lg, 12px);
      }
      .search-row tc-input {
        flex: 1;
      }
      .search-meta {
        font-family: var(--tc-font-mono, monospace);
        font-size: 0.78rem;
        color: var(--tc-color-ink-muted, #6b7280);
        white-space: nowrap;
        padding-bottom: 12px;
      }

      .feed {
        padding: 24px 0 32px;
      }

      /* Cards now have proper horizontal padding so the hover highlight
         sits inside a card-shaped area rather than running flush to the
         page edge. The negative margin keeps the visual width matching
         the rest of the wrap content. */
      .post-card {
        display: block;
        text-decoration: none;
        color: inherit;
        padding: 24px 20px;
        margin: 0 -20px;
        border-top: 1px solid var(--tc-color-rule, #ece5d3);
        border-radius: var(--tc-radius-md, 8px);
        transition: background 0.15s ease, transform 0.15s ease;
      }
      .post-card:first-child {
        border-top: none;
      }
      .post-card:hover {
        background: var(--tc-color-surface, #ffffff);
        transform: translateX(2px);
      }
      .post-card:hover h2 {
        color: var(--tc-color-accent, #a16939);
      }

      .post-meta {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: var(--tc-font-mono, monospace);
        font-size: 0.78rem;
        color: var(--tc-color-ink-muted, #6b7280);
        margin-bottom: 8px;
      }
      .post-tag {
        background: var(--tc-color-accent-soft, #efe2cf);
        color: var(--tc-color-accent-hover, #8a572d);
        border: 1px solid var(--tc-color-rule-strong, #d9cfb8);
        border-radius: var(--tc-radius-pill, 999px);
        padding: 2px 8px;
        font-size: 0.72rem;
        font-weight: 500;
      }
      .post-card h2 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 8px;
        letter-spacing: -0.01em;
        transition: color 0.15s ease;
      }
      .post-card p {
        color: var(--tc-color-ink-soft, #4a5061);
        font-size: 0.98rem;
        line-height: 1.6;
        margin: 0;
      }
      .post-card .read-more {
        display: inline-block;
        margin-top: 12px;
        font-family: var(--tc-font-mono, monospace);
        font-size: 0.82rem;
        color: var(--tc-color-accent, #a16939);
      }

      .empty {
        padding: 48px 20px;
        text-align: center;
        color: var(--tc-color-ink-muted, #6b7280);
        font-style: italic;
        background: var(--tc-color-surface, #ffffff);
        border: 1px dashed var(--tc-color-rule-strong, #d9cfb8);
        border-radius: var(--tc-radius-md, 8px);
      }

      .pager {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 0 64px;
        margin: 12px -20px 0;
      }
      .pager .info {
        font-family: var(--tc-font-mono, monospace);
        font-size: 0.84rem;
        color: var(--tc-color-ink-muted, #6b7280);
      }
      .pager-buttons {
        display: flex;
        gap: 8px;
      }

      @media (max-width: 720px) {
        .search-row {
          flex-direction: column;
          align-items: stretch;
          gap: 8px;
        }
        .search-meta {
          padding: 0;
          text-align: right;
        }
      }
    </style>
  </head>
  <body>
    <site-nav active="blog" version="v1.1.0" base="../"></site-nav>

    <main>
      <header class="page">
        <div class="wrap">
          <div class="eyebrow">Blog</div>
          <h1>Notes from building tan-compose.</h1>
          <p class="page-lede">
            Releases, design rationale, and short technical write-ups about the
            library and the platform it sits on. Mostly first-person and
            slightly opinionated.
          </p>

          <div class="search-row">
            <tc-input
              id="post-search"
              label="Search posts"
              name="q"
              placeholder="Filter by title, tag, or excerpt…"
              type="search"
            ></tc-input>
            <span class="search-meta" id="search-meta"></span>
          </div>
        </div>
      </header>

      <section class="feed">
        <div class="wrap">
          <div id="post-feed"></div>
          <div class="pager" id="pager"></div>
        </div>
      </section>
    </main>

    <site-footer base="../"></site-footer>

    <script type="module">
      // ---- Posts (newest first) -----------------------------------------
      const POSTS = [
        {
          href: "./anatomy-of-a-dashboard.html",
          date: "2026-05-10",
          tag: "deep dive · demo",
          title: "Anatomy of an admin dashboard",
          excerpt:
            "How the /demo/admin/ page composes — an in-memory store, a filter bar reading from three controls, a keyed datatable that embeds badges in cells, two modals with different state owners, a theme switcher in three constants, and the production gaps that would slot into the same shape.",
        },
        {
          href: "./build-a-tasks-app.html",
          date: "2026-05-10",
          tag: "tutorial · kit",
          title: "Build a tasks app in ~80 lines",
          excerpt:
            "A small CRUD app — list, add, mark done, delete, with live stats and toasts — wired entirely from @ra9/tan-compose-kit. No framework, no build step. The whole thing is one HTML file and about eighty lines of JavaScript.",
        },
        {
          href: "./feels-native.html",
          date: "2026-05-10",
          tag: "v0.4.0 · release",
          title: "Making custom elements feel native",
          excerpt:
            "v0.4 ships refs, Form-Associated Custom Elements, and shared adopted stylesheets — the seams that let tan-compose components compose with <form>, integrate with non-tan-compose code, and stay performant when you have many instances of the same tag.",
        },
        {
          href: "./why-i-built-tan-compose.html",
          date: "2026-05-10",
          tag: "v0.3.0 · launch",
          title: "Why I built tan-compose",
          excerpt:
            "On the framework tax for small UI, what the platform actually gives you, and the v0.3 building blocks for putting together real components — datatables, forms, anything bigger than a styled button — without reaching for React.",
        },
        {
          href: "./keyed-reconciliation-in-60-lines.html",
          date: "2026-05-10",
          tag: "deep dive",
          title: "Keyed list reconciliation in ~60 lines",
          excerpt:
            "How for: { items, key, render } actually works. The cache, the identity check, what gets torn down, and why no virtual DOM is involved. Annotated walk-through of the implementation in build.ts.",
        },
      ];

      const PAGE_SIZE = 5;

      // ---- State --------------------------------------------------------
      let query = "";
      let page = 0;

      const feed = document.getElementById("post-feed");
      const pager = document.getElementById("pager");
      const searchMeta = document.getElementById("search-meta");
      const search = document.getElementById("post-search");

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function matches(post, q) {
        if (!q) return true;
        const needle = q.toLowerCase();
        return (
          post.title.toLowerCase().includes(needle) ||
          post.tag.toLowerCase().includes(needle) ||
          post.excerpt.toLowerCase().includes(needle)
        );
      }

      function render() {
        const filtered = POSTS.filter((p) => matches(p, query));
        const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
        if (page >= totalPages) page = totalPages - 1;
        if (page < 0) page = 0;

        const slice = filtered.slice(
          page * PAGE_SIZE,
          page * PAGE_SIZE + PAGE_SIZE,
        );

        // Search meta
        searchMeta.textContent = query
          ? `${filtered.length} of ${POSTS.length} posts`
          : `${POSTS.length} posts`;

        // Feed
        if (slice.length === 0) {
          feed.innerHTML = `<div class="empty">No posts match "${
            escapeHtml(query)
          }".</div>`;
        } else {
          feed.innerHTML = slice.map((p) => `
            <a class="post-card" href="${escapeHtml(p.href)}">
              <div class="post-meta">
                <span>${escapeHtml(p.date)}</span>
                <span class="post-tag">${escapeHtml(p.tag)}</span>
              </div>
              <h2>${escapeHtml(p.title)}</h2>
              <p>${escapeHtml(p.excerpt)}</p>
              <span class="read-more">Read post &rarr;</span>
            </a>
          `).join("");
        }

        // Pager
        if (filtered.length <= PAGE_SIZE) {
          pager.innerHTML = "";
          pager.style.display = "none";
        } else {
          pager.style.display = "flex";
          pager.innerHTML = `
            <span class="info">page ${page + 1} of ${totalPages}</span>
            <div class="pager-buttons">
              <tc-button id="prev" variant="secondary" size="sm" ${
            page === 0 ? "disabled" : ""
          }>← prev</tc-button>
              <tc-button id="next" variant="secondary" size="sm" ${
            page >= totalPages - 1 ? "disabled" : ""
          }>next →</tc-button>
            </div>
          `;
          const prev = pager.querySelector("#prev");
          const next = pager.querySelector("#next");
          prev?.addEventListener("click", () => {
            page--;
            render();
          });
          next?.addEventListener("click", () => {
            page++;
            render();
          });
        }
      }

      // ---- Wire search --------------------------------------------------
      // tc-input dispatches `tc-input` with detail.value; native `input`
      // also bubbles. Listen to both so we catch whichever path fires.
      function onSearch(value) {
        query = (value ?? "").trim();
        page = 0;
        render();
      }
      search.addEventListener("tc-input", (e) => onSearch(e.detail?.value));
      search.addEventListener("input", (e) => onSearch(e.target?.value));

      render();
    </script>
  </body>
</html>
