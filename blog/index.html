<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tan Compose blog — release notes, tutorials, and posts about composing custom-element-based design systems." />
    <title>Blog — Tan Compose</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script type="module" src="../dist/site.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        font-family: var(--tc-font-sans, "Inter", system-ui, sans-serif);
        line-height: 1.6;
        color: var(--tc-color-ink, #14171f);
        background: var(--tc-color-bg, #faf8f3);
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }

      header.page { padding: 64px 0 24px; }
      .eyebrow {
        font-family: var(--tc-font-mono, "JetBrains Mono", monospace);
        font-size: 0.78rem; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.08em;
        color: var(--tc-color-accent, #a16939);
        margin-bottom: 12px;
      }
      h1 {
        font-size: clamp(2rem, 4vw, 2.6rem);
        font-weight: 800; letter-spacing: -0.02em;
        line-height: 1.1; margin-bottom: 14px;
      }
      .lede {
        color: var(--tc-color-ink-soft, #4a5061);
        font-size: 1.05rem; max-width: 620px;
      }

      .search-row { margin: 28px 0 8px; }
      .search-row tc-input { display: block; }

      section.posts { padding: 0 0 64px; }
      .post {
        display: block;
        text-decoration: none;
        color: inherit;
        padding: 24px 20px;
        margin: 0 -20px;
        border-top: 1px solid var(--tc-color-rule, #ece5d3);
        border-radius: var(--tc-radius-md, 10px);
        transition: background 0.15s ease;
      }
      .post:hover { background: var(--tc-color-accent-soft, #efe2cf); }
      .post-meta {
        font-family: var(--tc-font-mono, "JetBrains Mono", monospace);
        font-size: 0.78rem;
        color: var(--tc-color-ink-muted, #6b7280);
        margin-bottom: 6px;
      }
      .post-meta .tag {
        color: var(--tc-color-accent, #a16939);
        margin-left: 6px;
      }
      .post h2 {
        font-size: 1.3rem; font-weight: 700;
        letter-spacing: -0.01em;
        margin-bottom: 6px;
      }
      .post p {
        color: var(--tc-color-ink-soft, #4a5061);
        font-size: 0.98rem;
      }

      .pager {
        display: flex; align-items: center; justify-content: space-between;
        margin: 24px 0 0;
        font-family: var(--tc-font-mono, "JetBrains Mono", monospace);
        font-size: 0.85rem;
        color: var(--tc-color-ink-muted, #6b7280);
      }
      .empty {
        padding: 28px;
        text-align: center;
        color: var(--tc-color-ink-muted, #6b7280);
        font-size: 0.92rem;
        border: 1px dashed var(--tc-color-rule, #ece5d3);
        border-radius: var(--tc-radius-md, 10px);
        margin-top: 16px;
      }

      @media (max-width: 720px) {
        header.page { padding: 40px 0 16px; }
      }
    </style>
  </head>
  <body>
    <site-nav active="blog" version="v1.1.0" base="../"></site-nav>

    <main>
      <header class="page">
        <div class="wrap">
          <div class="eyebrow">blog</div>
          <h1>Notes from building tan-compose.</h1>
          <p class="lede">
            Release notes, design decisions, and tutorials for
            <code>@ra9/tan-compose</code> and the kit. Posts that survive
            the moment they were written and explain the why, not just the
            what.
          </p>
          <div class="search-row">
            <tc-input id="post-search" placeholder="Search posts…" aria-label="Search posts"></tc-input>
          </div>
        </div>
      </header>

      <section class="posts">
        <div class="wrap">
          <div id="post-results"></div>
          <div class="pager" id="post-pager"></div>
        </div>
      </section>
    </main>

    <site-footer base="../"></site-footer>

    <script type="module">
      const POSTS = [
        {
          href: "./why-i-built-tan-compose.html",
          title: "Why I built tan-compose",
          date: "2026-05-10",
          tag: "essay",
          excerpt:
            "On the framework tax for small UI, what the platform actually gives you, and the v0.3 building blocks for putting together real components — datatables, forms, anything bigger than a styled button — without reaching for React.",
        },
        {
          href: "./feels-native.html",
          title: "Making custom elements feel native",
          date: "2026-05-10",
          tag: "v0.4.0 · release",
          excerpt:
            "v0.3 gave us building blocks. v0.4 is about the seams — refs, form-association, and adopted stylesheets that let a tan-compose element behave like a real platform primitive.",
        },
        {
          href: "./built-the-site-with-the-kit.html",
          title: "I rebuilt the docs site with the library it documents.",
          date: "2026-05-10",
          tag: "meta · rewrite",
          excerpt:
            "Twelve pages, 2,470 fewer lines of HTML, three new shared primitives, and five small papercuts that I'd never have noticed without trying to live inside the library. The wins, the cost, the things I'd change next.",
        },
        {
          href: "./build-a-tasks-app.html",
          title: "Build a tasks app in ~80 lines",
          date: "2026-05-10",
          tag: "tutorial · kit",
          excerpt:
            "A small CRUD app — list, add, mark done, delete, with live stats and toasts — wired entirely from @ra9/tan-compose-kit. No framework, no build step. The whole thing is one HTML file and about eighty lines of JavaScript.",
        },
        {
          href: "./anatomy-of-a-dashboard.html",
          title: "Anatomy of an admin dashboard",
          date: "2026-05-10",
          tag: "kit · case study",
          excerpt:
            "How the /demo/admin/ page composes — an in-memory store, a filter bar reading from three controls, a keyed datatable that embeds badges in cells, two modals with different state owners, a theme switcher in three constants, and the production gaps that would slot into the same shape.",
        },
        {
          href: "./keyed-reconciliation-in-60-lines.html",
          title: "Keyed list reconciliation in ~60 lines",
          date: "2026-05-10",
          tag: "internals",
          excerpt:
            "How for: { items, key, render } actually works. The cache, the identity check, what gets torn down, and why no virtual DOM is involved. Annotated walk-through of the implementation in build.ts.",
        },
      ];

      const PAGE_SIZE = 5;
      let query = "";
      let page = 1;

      const search = document.getElementById("post-search");
      const results = document.getElementById("post-results");
      const pager = document.getElementById("post-pager");

      function filtered() {
        const q = query.trim().toLowerCase();
        if (!q) return POSTS;
        return POSTS.filter((p) =>
          (p.title + " " + p.tag + " " + p.excerpt).toLowerCase().includes(q)
        );
      }

      function escapeHtml(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function render() {
        const all = filtered();
        const totalPages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
        if (page > totalPages) page = totalPages;
        const start = (page - 1) * PAGE_SIZE;
        const slice = all.slice(start, start + PAGE_SIZE);

        if (slice.length === 0) {
          results.innerHTML =
            `<div class="empty">No posts match "${escapeHtml(query)}".</div>`;
        } else {
          results.innerHTML = slice
            .map((p) => `
              <a class="post" href="${p.href}">
                <div class="post-meta">${p.date}<span class="tag">${escapeHtml(p.tag)}</span></div>
                <h2>${escapeHtml(p.title)}</h2>
                <p>${escapeHtml(p.excerpt)}</p>
              </a>
            `)
            .join("");
        }

        if (totalPages <= 1) {
          pager.innerHTML = "";
        } else {
          pager.innerHTML = `
            <span>page ${page} of ${totalPages} · ${all.length} post${all.length === 1 ? "" : "s"}</span>
            <span>
              <tc-button id="prev" size="sm" variant="ghost" ${page === 1 ? "disabled" : ""}>← Prev</tc-button>
              <tc-button id="next" size="sm" variant="ghost" ${page === totalPages ? "disabled" : ""}>Next →</tc-button>
            </span>
          `;
          document.getElementById("prev")?.addEventListener("click", () => {
            if (page > 1) { page--; render(); }
          });
          document.getElementById("next")?.addEventListener("click", () => {
            if (page < totalPages) { page++; render(); }
          });
        }
      }

      function onSearch(value) {
        query = String(value ?? "");
        page = 1;
        render();
      }

      search.addEventListener("tc-input", (e) => onSearch(e.detail?.value));
      search.addEventListener("input", (e) => onSearch(e.target?.value));

      render();
    </script>
  </body>
</html>
